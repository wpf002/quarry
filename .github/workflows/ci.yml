name: ci

on:
  push:
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Prisma client is generated offline; no database is required for CI.
      - run: pnpm db:generate
      - run: pnpm typecheck
      - run: pnpm build
      # Enforcer + unit suites. Turbo builds workspace deps first (^build).
      - run: pnpm test
